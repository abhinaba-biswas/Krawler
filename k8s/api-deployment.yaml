apiVersion: apps/v1
kind: Deployment
metadata:
  name: krawler-api
  namespace: krawler
  labels:
    app: krawler-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: krawler-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: krawler-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: krawler-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: krawler-config
            - secretRef:
                name: krawler-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: krawler-api-svc
  namespace: krawler
spec:
  selector:
    app: krawler-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
