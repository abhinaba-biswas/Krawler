apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: krawler-ingress
  namespace: krawler
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # cert-manager.io/cluster-issuer: letsencrypt-prod   # Uncomment for TLS
spec:
  # tls:
  #   - hosts:
  #       - krawler.example.com
  #     secretName: krawler-tls
  rules:
    - host: krawler.example.com   # Replace with your domain
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: krawler-api-svc
                port:
                  number: 80
          - path: /health
            pathType: Exact
            backend:
              service:
                name: krawler-api-svc
                port:
                  number: 80
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: krawler-api-svc
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: krawler-frontend-svc
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: krawler-frontend-svc
  namespace: krawler
spec:
  selector:
    app: krawler-frontend
  ports:
    - port: 80
      targetPort: 3000
