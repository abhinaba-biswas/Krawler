apiVersion: v1
kind: ConfigMap
metadata:
  name: krawler-config
  namespace: krawler
data:
  REDIS_URL: "redis://redis-svc:6379"
  DATABASE_URL: "postgresql+asyncpg://krawler:krawler@postgres-svc:5432/krawler"
  S3_ENDPOINT_URL: "http://minio-svc:9000"
  S3_BUCKET: "krawler"
  S3_REGION: "us-east-1"
  DEBUG: "false"
  ENABLE_METRICS: "true"
  WORKER_CONCURRENCY: "10"
  DEFAULT_DEPTH: "3"
  DEFAULT_CONCURRENCY: "5"
  RATE_LIMIT_RPS: "1.0"
---
apiVersion: v1
kind: Secret
metadata:
  name: krawler-secrets
  namespace: krawler
type: Opaque
stringData:
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin"
  # API_KEY: "change-me-in-production"
